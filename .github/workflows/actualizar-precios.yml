name: Actualizar precios

on:
  schedule:
    - cron: '17 6 * * *'   # todos los días a las 06:17 UTC
  workflow_dispatch:        # botón para lanzarlo a mano

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Descargar precios
        run: node scripts/update-data.mjs
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Precios actualizados $(date -u +%F)"
          git push
